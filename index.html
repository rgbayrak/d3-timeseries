<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>physAI-QA-interactive</title>
  <link rel="stylesheet" href="/src/shell/tabs.css" />
  <style>
    /* Text font, sizes and colours come from src/shell/tabs.css, shared with the Stats tabs */
    body {
      margin: 0;
      padding: 24px;
    }

    #focus-chart,
    #context-chart {
      max-width: 960px;
      margin: 0 auto;
    }

    #context-chart {
      margin-top: 4px;
    }

    .axis path,
    .axis line {
      stroke: #999;
    }

    .grid line {
      shape-rendering: crispEdges;
    }

    .grid path {
      display: none;
    }

    .zoom-rect {
      cursor: crosshair;
    }

    .brush .selection {
      stroke: rgba(0, 119, 190, 0.4);
      fill: rgba(0, 119, 190, 0.15);
    }

    #controls {
      max-width: 960px;
      margin: 0 auto 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Rows: 1 = scan/channel pickers, 2 = navigation + search, 3 = tools */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    #controls label {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #search-input {
      width: 120px;
    }

    #loading {
      font-size: 12px;
      color: var(--text-3);
    }

    #quality-badges {
      max-width: 960px;
      margin: 0 auto 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quality-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .quality-badge.pass {
      background: #e6f4ea;
      color: #1e7e34;
      border: 1px solid #b7e1c4;
    }

    .quality-badge.fail {
      background: #fce8e6;
      color: #c62828;
      border: 1px solid #f5b7b1;
    }

    .quality-badge.timing-verified {
      background: #e6f4ea;
      color: #1e7e34;
      border: 1px solid #b7e1c4;
    }

    .quality-badge.timing-corrected,
    .quality-badge.timing-unverified {
      background: #fff4e5;
      color: #8a5a00;
      border: 1px solid #f3d19e;
    }

    .quality-badge.timing-mismatch {
      background: #fce8e6;
      color: #c62828;
      border: 1px solid #f5b7b1;
    }

    .quality-badge[title] {
      cursor: help;
    }

    .quality-badge .pct {
      font-weight: 400;
      opacity: 0.8;
    }

    /* Charts (3/4) left, Annotations (1/4) right; on narrow screens left first, then right.
       The charts resize to their column, all to the same width, so time axes still line up. */
    .explore-layout {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .explore-main {
      min-width: 0;
    }

    @media (max-width: 760px) {
      .explore-layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* Annotations box: Full Recording, then Time Windows below it */
    #annotation-section {
      box-sizing: border-box;
      padding: 12px 14px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    #annotation-section h3 {
      margin: 0 0 10px;
    }

    .annotation-cols {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .annotation-col {
      min-width: 0; /* let long annotation text wrap inside its column */
    }

    #annotation-section h4 {
      margin: 0 0 8px;
    }

    .annotation-field + .annotation-field {
      margin-top: 10px;
    }

    /* Signal Quality, Notes */
    .field-label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
    }


    /* Whole-waveform rating (one .btn per rating; the chosen one is .active) and comment */
    .waveform-quality {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #waveform-comment {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 6px 8px;
      font-size: 13px;
      line-height: 1.4;
      resize: vertical;
    }

    .annotation-empty {
      font-size: 12px;
      color: var(--text-3);
    }

    .annotation-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid #f0c9a0;
      background: #fdf3e7;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .annotation-range {
      font-family: monospace;
      color: #b5651d;
      white-space: nowrap;
    }

    .annotation-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--text);
    }

    .annotation-remove {
      cursor: pointer;
      border: none;
      background: transparent;
      color: #a33;
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
    }

    .annotation-remove:hover {
      color: #d00;
    }

    /* Section labels above the main channel and the auxiliary charts (lettering from tabs.css) */
    .section-label {
      max-width: 960px;
      margin: 0 auto 6px;
    }

    #auxiliary-section {
      max-width: 960px;
      margin: 12px auto 0;
    }

    /* Short divider line before every section but the first, same as the Stats tabs (quality.html h3::before) */
    #auxiliary-section .section-label::before {
      content: '';
      display: block;
      width: 48px;
      height: 2px;
      margin: 8px 0 18px;
      background: #c9c9d3;
      border-radius: 1px;
    }

    #confounds-section {
      max-width: 960px;
      margin: 0 auto;
    }

    #stack-section:not([style*="none"]) + #confounds-section {
      margin-top: 12px;
    }

    /* Confounds file name: same look as the scan file name (.now-viewing-file) */
    #confounds-label {
      margin-bottom: 4px;
    }

    #confounds-chart {
      max-width: 960px;
    }

    /* Stacked channel picker (controls row) */
    .stack-title {
      font-size: 14px;
    }

    #stack-channels {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    #controls #stack-channels label {
      cursor: pointer;
      user-select: none;
    }

    /* Stacked channel figures, one per checked channel */
    #stack-section {
      max-width: 960px;
      margin: 0 auto;
    }

    #stack-section .stack-chart {
      max-width: 960px;
    }
  </style>
</head>
<body>
  <nav class="folder-tabs" aria-label="Sections">
    <a class="folder-tab active" href="/" aria-current="page">Explore and Annotate</a>
    <a class="folder-tab" href="/quality.html#group">Stats Group</a>
    <a class="folder-tab" href="/quality.html#subject">Stats Individual</a>
  </nav>
  <div id="dataset-info" class="dataset-header"></div>
  <div id="controls">
    <div class="controls-row">
      <label>Subject <select id="subject-select"></select></label>
      <label>Session <select id="session-select"></select></label>
      <label>Task <select id="task-select"></select></label>
      <label id="run-label" style="display:none">Run <select id="run-select"></select></label>
      <label>Channel <select id="channel-select"></select></label>
      <label id="confound-label" style="display:none">Confound <select id="confound-select"></select></label>
    </div>
    <div class="controls-row" id="stack-row" style="display:none">
      <span class="stack-title">Stack</span>
      <span id="stack-channels"></span>
    </div>
    <div class="controls-row">
      <button id="prev-btn" class="btn" type="button" title="Previous scan (←)">&laquo; Prev</button>
      <button id="next-btn" class="btn" type="button" title="Next scan (→)">Next &raquo;</button>
      <input id="search-input" type="text" placeholder="e.g. sub-03 or ses-012">
      <span id="loading"></span>
    </div>
    <div class="controls-row">
      <button id="annotate-mode-btn" class="btn" type="button">Annotate: Off</button>
    </div>
  </div>
  <div class="now-viewing"><span class="now-viewing-label">Now viewing:</span> <span id="filename" class="now-viewing-file"></span><span id="annotation-progress" class="annotation-progress" title="Scans with a signal quality rating, notes or time windows saved for this channel"></span></div>
  <div id="quality-badges"></div>
  <!-- Charts (3/4) on the left, Annotations (1/4) on the right; stacked left then right on narrow screens -->
  <div class="explore-layout">
  <div class="explore-main">
  <div class="section-label">Signal of interest</div>
  <div id="focus-chart"></div>
  <div id="context-chart"></div>
  <!-- Stacked channels and the confound; shown when either is (see src/viewer/main.ts) -->
  <div id="auxiliary-section" style="display:none;">
    <div class="section-label">Auxiliary</div>
    <div id="stack-section" style="display:none;"></div>
    <div id="confounds-section" style="display:none;">
      <div id="confounds-label" class="now-viewing-file"></div>
      <div id="confounds-chart"></div>
    </div>
  </div>
  </div>
  <aside class="explore-side">
  <!-- Annotations box: Full Recording (signal quality, notes), then Time Windows -->
  <section id="annotation-section" aria-labelledby="annotations-title">
    <h3 id="annotations-title">Annotations</h3>
    <div class="annotation-cols">
      <div class="annotation-col">
        <h4>Full Recording</h4>
        <div class="annotation-field">
          <div class="field-label" id="signal-quality-label">Signal Quality</div>
          <div id="waveform-quality" class="waveform-quality" role="group" aria-labelledby="signal-quality-label">
            <button class="btn" type="button" data-quality="good" aria-pressed="false">Good</button>
            <button class="btn" type="button" data-quality="bad" aria-pressed="false">Bad</button>
            <button class="btn" type="button" data-quality="fixable" aria-pressed="false">Fixable</button>
            <button class="btn" type="button" data-quality="unknown" aria-pressed="false">Unknown</button>
          </div>
        </div>
        <div class="annotation-field">
          <label class="field-label" for="waveform-comment">Notes</label>
          <textarea id="waveform-comment" rows="3" placeholder="Quality analysis notes for the full recording"></textarea>
        </div>
      </div>
      <div class="annotation-col">
        <h4>Time Windows</h4>
        <div id="annotation-list"></div>
      </div>
    </div>
  </section>
  </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
