<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D3 + TypeScript Chart Library</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
      background: #fff;
    }

    #focus-chart,
    #context-chart {
      max-width: 960px;
      margin: 0 auto;
    }

    #context-chart {
      margin-top: 4px;
    }

    .axis path,
    .axis line {
      stroke: #999;
    }

    .grid line {
      shape-rendering: crispEdges;
    }

    .grid path {
      display: none;
    }

    .zoom-rect {
      cursor: crosshair;
    }

    .brush .selection {
      stroke: rgba(0, 119, 190, 0.4);
      fill: rgba(0, 119, 190, 0.15);
    }

    #controls {
      max-width: 960px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    #controls label {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #controls select {
      font-size: 14px;
      padding: 2px 6px;
    }

    #prev-btn, #next-btn {
      font-size: 14px;
      padding: 2px 12px;
      cursor: pointer;
    }

    #search-input {
      font-size: 14px;
      padding: 2px 6px;
      width: 120px;
    }

    #filename {
      max-width: 960px;
      margin: 0 auto 6px;
      font-size: 13px;
      color: #555;
      font-family: monospace;
    }

    .axis-label {
      font-size: 14px;
      font-weight: 600;
    }

    #loading {
      font-size: 13px;
      color: #888;
    }

    #quality-badges {
      max-width: 960px;
      margin: 0 auto 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quality-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .quality-badge.pass {
      background: #e6f4ea;
      color: #1e7e34;
      border: 1px solid #b7e1c4;
    }

    .quality-badge.fail {
      background: #fce8e6;
      color: #c62828;
      border: 1px solid #f5b7b1;
    }

    .quality-badge .pct {
      font-weight: 400;
      opacity: 0.8;
    }

    #compute-sqi-btn {
      font-size: 13px;
      padding: 3px 12px;
      cursor: pointer;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: #f5f5f5;
    }

    #compute-sqi-btn:hover:not(:disabled) {
      background: #e8e8e8;
    }

    #compute-sqi-btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #annotate-mode-btn {
      font-size: 13px;
      padding: 3px 12px;
      cursor: pointer;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: #f5f5f5;
    }

    #annotate-mode-btn:hover {
      background: #e8e8e8;
    }

    #annotate-mode-btn.active {
      background: #e67e22;
      color: #fff;
      border-color: #c8690f;
    }

    #annotation-section {
      max-width: 960px;
      margin: 8px auto 12px;
    }

    #annotation-section h3 {
      margin: 0 0 6px;
      font-size: 13px;
      color: #333;
    }

    .annotation-empty {
      font-size: 12px;
      color: #888;
      font-style: italic;
    }

    .annotation-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid #f0c9a0;
      background: #fdf3e7;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .annotation-range {
      font-family: monospace;
      color: #b5651d;
      white-space: nowrap;
    }

    .annotation-text {
      flex: 1;
      color: #333;
    }

    .annotation-remove {
      cursor: pointer;
      border: none;
      background: transparent;
      color: #a33;
      font-size: 14px;
      line-height: 1;
      padding: 0 4px;
    }

    .annotation-remove:hover {
      color: #d00;
    }

    #sqi-section {
      max-width: 960px;
      margin: 0 auto 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      background: #fafafa;
    }

    #sqi-section .sqi-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    #sqi-section .sqi-header h3 {
      margin: 0;
      font-size: 14px;
      color: #333;
    }

    #sqi-section .sqi-header button {
      font-size: 12px;
      padding: 2px 10px;
      cursor: pointer;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: #f5f5f5;
    }

    #sqi-col-controls {
      margin-bottom: 8px;
    }

    #sqi-col-controls .sqi-groups {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    #sqi-col-controls .sqi-groups button {
      font-size: 11px;
      padding: 2px 10px;
      cursor: pointer;
      border: 1px solid #bbb;
      border-radius: 12px;
      background: #f5f5f5;
      color: #444;
      transition: background 0.1s, color 0.1s;
    }

    #sqi-col-controls .sqi-groups button:hover {
      background: #e0e0e0;
    }

    #sqi-col-controls .sqi-groups button.active {
      background: #2d8a8e;
      color: #fff;
      border-color: #247275;
    }

    #sqi-col-controls .sqi-checkboxes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #sqi-col-controls .sqi-checkboxes label {
      font-size: 11px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }

    #sqi-col-controls .sqi-checkboxes input {
      margin: 0;
    }

    #sqi-table-container {
      overflow-x: auto;
    }

    #sqi-table-container table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
    }

    #sqi-table-container th,
    #sqi-table-container td {
      border: 1px solid #ddd;
      padding: 4px 8px;
      white-space: nowrap;
    }

    #sqi-table-container th {
      background: #f0f0f0;
      font-weight: 600;
      text-align: left;
      position: sticky;
      top: 0;
    }

    #sqi-table-container th[data-tip] {
      position: relative;
      cursor: help;
      text-decoration: underline dotted #999;
      text-underline-offset: 3px;
    }

    #sqi-table-container th[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      left: 0;
      top: 100%;
      z-index: 10;
      margin-top: 4px;
      padding: 6px 10px;
      max-width: 260px;
      width: max-content;
      white-space: normal;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.4;
      color: #fff;
      background: #333;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      pointer-events: none;
    }

    #sqi-table-container th:nth-last-child(-n+4)[data-tip]:hover::after {
      left: auto;
      right: 0;
    }

    #sqi-table-container td {
      font-family: monospace;
      text-align: right;
    }

    #sqi-table-container td:first-child {
      text-align: left;
      font-family: sans-serif;
      font-weight: 600;
    }

    #sqi-table-container tr:hover {
      background: #eef6ff;
    }

    #confounds-section {
      max-width: 960px;
      margin: 0 auto;
      border-top: 1px solid #ddd;
      padding-top: 8px;
      margin-top: 12px;
    }

    #confounds-label {
      font-size: 13px;
      color: #555;
      font-family: monospace;
      margin-bottom: 4px;
    }

    #confounds-chart {
      max-width: 960px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label>Subject <select id="subject-select"></select></label>
    <label>Session <select id="session-select"></select></label>
    <label>Task <select id="task-select"></select></label>
    <label id="run-label" style="display:none">Run <select id="run-select"></select></label>
    <label>Channel <select id="channel-select"></select></label>
    <button id="prev-btn" type="button">&laquo; Prev</button>
    <button id="next-btn" type="button">Next &raquo;</button>
    <input id="search-input" type="text" placeholder="e.g. sub-03 or ses-012">
    <span id="loading"></span>
    <button id="compute-sqi-btn" type="button">Compute SQI</button>
    <button id="annotate-mode-btn" type="button">Annotate: Off</button>
  </div>
  <div id="filename"></div>
  <div id="quality-badges"></div>
  <div id="sqi-section" style="display:none">
    <div class="sqi-header">
      <h3>Signal Quality Metrics</h3>
      <button id="hide-sqi-btn" type="button">Hide</button>
    </div>
    <div id="sqi-col-controls"></div>
    <div id="sqi-table-container"></div>
  </div>
  <div id="focus-chart"></div>
  <div id="context-chart"></div>
  <div id="annotation-section">
    <h3>Annotations</h3>
    <div id="annotation-list"></div>
  </div>
  <div id="confounds-section" style="display:none;">
    <div id="confounds-label"></div>
    <div id="confounds-chart"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
