<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>physAI-QA-interactive: quality metrics</title>
  <link rel="stylesheet" href="/src/shell/tabs.css" />
  <style>
    /* Stats theme: purple and blue, for the tab stripe and the charts (THEME and
       FAMILY in src/quality/charts.ts; add new colours from there, not new hues).
       Text, dropdowns, buttons, links and badges come from src/shell/tabs.css,
       so they look the same on every tab. */
    :root {
      --violet: #7b4fd0;
      --blue: #4a6cd4;
      /* folder tab stripe (src/shell/tabs.css) */
      --tab-accent: linear-gradient(90deg, var(--violet), var(--blue));
    }

    body {
      margin: 0;
      padding: 24px;
    }

    /* Same width as Explore and Annotate (--page-width in tabs.css), so the tabs and dataset header stay put */
    .page {
      max-width: var(--page-width);
      margin: 0 auto;
    }

    /* Left column (1/5) beside the graphs (4/5), in two rows:
       row 1 = participant, recording, PDF report | Prev/Next, file name, waveforms,
       row 2 = Metrics shown | metric tables and histograms, so the box starts level with them */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 4fr); /* left column 1/5, graphs 4/5 */
      column-gap: 24px;
      align-items: start;
    }

    .side-top { grid-column: 1; grid-row: 1; }
    .main-top { grid-column: 2; grid-row: 1; }
    .side-metrics { grid-column: 1; grid-row: 2; }
    .main-metrics { grid-column: 2; grid-row: 2; }

    /* Short divider closing row 1 in the graphs column, then row 2 starts level in both columns */
    .main-top::after {
      content: '';
      display: block;
      width: 48px;
      height: 2px;
      margin: 24px 0 0;
      background: #c9c9d3;
      border-radius: 1px;
    }

    .side-metrics,
    .main-metrics {
      margin-top: 18px;
    }

    .sidebar {
      font-size: var(--fs-md);
    }

    .side-top {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Sidebar block titles use the shared .section-label lettering */
    .sidebar .section-label {
      margin-bottom: 6px;
    }

    /* Short divider between sidebar blocks, same as between sections */
    .side-block + .side-block::before {
      content: '';
      display: block;
      width: 48px;
      height: 2px;
      margin-bottom: 14px;
      background: #c9c9d3;
      border-radius: 1px;
    }

    /* Boxed sidebar block (Metrics shown): same simple box as the Annotations box in Explore and Annotate */
    .side-box {
      box-sizing: border-box;
      padding: 12px 14px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    /* Metrics shown: narrower than its 1/5 column, at the column's left edge,
       leaving space between it and the graphs */
    .side-metrics {
      width: 85%;
      justify-self: start;
    }

    @media (max-width: 760px) {
      .side-metrics {
        width: 100%; /* one column: full width */
      }
    }

    /* Each row's first heading starts at the top of its row, level with the left column */
    .main-top > h3:first-child,
    .main-metrics > h3:first-child {
      margin-top: 0;
    }

    /* One key/value per line in the narrow column */
    .sidebar .kv-grid {
      flex-direction: column;
      gap: 3px;
    }

    .sidebar .kv .v {
      overflow-wrap: anywhere;
    }

    .report-status {
      overflow-wrap: anywhere;
    }

    .graphs {
      min-width: 0;
    }

    .graphs svg {
      max-width: 100%;
      height: auto;
    }

    /* Narrow screens: one column, each box right above the graphs it belongs with */
    @media (max-width: 760px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .side-top { grid-column: 1; grid-row: 1; }
      .main-top { grid-column: 1; grid-row: 2; margin-top: 16px; }
      .side-metrics { grid-column: 1; grid-row: 3; }
      .main-metrics { grid-column: 1; grid-row: 4; }
    }

    .page .folder-tabs,
    .page .dataset-header {
      max-width: none;
    }

    /* Metrics shown: listed in the sidebar; group names are fixed headings,
       each metric row has a plain checkmark on the right */
    .metric-picker {
      font-size: var(--fs-md);
    }

    .metric-picker-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }

    .metric-count {
      margin-bottom: 6px;
    }

    .metric-group + .metric-group {
      margin-top: 8px;
    }

    .metric-group-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }

    .metric-row:hover {
      background: #f1f3f6;
    }

    /* Mini box; a thin tick inside when the metric is shown */
    .metric-check {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      margin: 0;
      width: 12px;
      height: 12px;
      flex: none;
      border: 1px solid #b8bec6;
      border-radius: 2px;
      background: #fff;
      cursor: pointer;
    }

    .metric-check:checked::before {
      content: '';
      position: absolute;
      left: 3.5px;
      top: 1px;
      width: 3px;
      height: 6px;
      border: solid var(--text);
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    .metric-check:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 1px;
      border-radius: 3px;
    }

    #status {
      font-size: var(--fs-md);
      color: #8a5a00;
      background: #fff4e5;
      border: 1px solid #f3d19e;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }

    code {
      font: var(--fs-sm) var(--mono);
      background: #f1f3f6;
      color: var(--text);
      padding: 1px 5px;
      border-radius: 4px;
    }

    h3 {
      margin: 20px 0 8px;
    }

    /* Short divider line between sections (not before a tab's first section) */
    h3:not(:first-child)::before {
      content: '';
      display: block;
      width: 48px;
      height: 2px;
      margin: 8px 0 18px;
      background: #c9c9d3;
      border-radius: 1px;
    }

    h4 {
      margin: 14px 0 6px;
    }

    table {
      border-collapse: collapse;
      font-size: var(--fs-sm);
      margin-top: 6px;
    }

    /* Tables stay neutral: no theme colours */
    th,
    td {
      border: 1px solid #ddd;
      padding: 4px 8px;
      white-space: nowrap;
    }

    th {
      background: #f5f5f5;
      color: var(--text);
      font-weight: 600;
      text-align: left;
    }

    th[title] {
      cursor: help;
      text-decoration: underline dotted var(--text-3);
      text-underline-offset: 3px;
    }

    .metrics-table td:not(:first-child) {
      font-family: var(--mono);
      text-align: right;
    }

    .metrics-wrap {
      overflow-x: auto;
    }

    /* Per channel: heading, table, note, histograms, with room between them */
    #subject-metrics section + section {
      margin-top: 28px;
    }

    #subject-metrics .metrics-wrap {
      margin-bottom: 14px;
    }

    #subject-metrics section > .muted {
      margin-bottom: 8px;
    }

    .metrics-table .pct {
      display: block;
      font-size: var(--fs-xs);
      color: var(--text-3);
    }

    .axis path,
    .axis line {
      stroke: #9a95b5;
    }

    .grid line {
      shape-rendering: crispEdges;
    }

    .grid path {
      display: none;
    }

    .hist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }

    .hist-empty {
      font-size: var(--fs-sm);
      color: var(--text-3);
    }

    .scan-picker {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .open-viewer {
      margin-left: auto;
      font-size: var(--fs-md);
    }

    .kv-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      font-size: var(--fs-md);
    }

    .kv .k {
      color: var(--text-3);
      margin-right: 4px;
    }

    .kv[title] {
      cursor: help;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .waveform-chart {
      margin-bottom: 2px;
    }

  </style>
</head>
<body>
  <div class="page">
    <nav class="folder-tabs" aria-label="Sections">
      <a class="folder-tab" href="/">Explore and Annotate</a>
      <a class="folder-tab active" href="/quality.html" aria-current="page">Stats</a>
    </nav>
    <div id="dataset-info" class="dataset-header"></div>

    <div id="status" style="display:none"></div>

    <!-- Under the dataset header, a grid of two rows: left column 1/5, graphs 4/5.
         Row 1: participant and recording info, PDF report | Prev/Next, file name, waveforms.
         Row 2: Metrics shown box | the metric tables and histograms it controls, so both start level. -->
    <div class="layout">
      <aside class="sidebar side-top" aria-label="Scan information">
        <div class="side-block">
          <div class="section-label">Participant info</div>
          <div id="subject-participant"></div>
        </div>

        <div class="side-block">
          <div class="section-label">Recording details</div>
          <div id="subject-scan"></div>
        </div>

        <!-- Built and saved once per computed dataset (src/quality/main.ts) -->
        <div class="side-block">
          <div class="section-label">PDF report</div>
          <div id="report-status" class="report-status muted"></div>
        </div>
      </aside>

      <!-- Level with the metrics (row 2) -->
      <aside class="sidebar side-box side-metrics" aria-label="Metrics shown">
        <div class="section-label">Metrics shown</div>
        <div id="metric-picker"></div>
      </aside>

      <div class="graphs main-top">
      <div class="scan-picker">
        <button id="scan-prev" class="btn" type="button">&laquo; Prev</button>
        <button id="scan-next" class="btn" type="button">Next &raquo;</button>
        <a id="open-viewer" class="open-viewer" href="/" title="Explore and Annotate opens on the scan shown here">Open this scan in Explore and Annotate &rarr;</a>
      </div>
      <div class="now-viewing"><span class="now-viewing-label">Now viewing:</span> <span id="subject-filename" class="now-viewing-file"></span></div>

      <h3>Signals over the whole recording</h3>
      <div id="subject-waveforms"></div>
      </div>

      <div class="graphs main-metrics">
      <h3>Quality metrics for this scan</h3>
      <div class="muted">Each value's percentile is among all recordings of the same channel in this dataset.</div>
      <div id="subject-metrics"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/quality/main.ts"></script>
</body>
</html>
